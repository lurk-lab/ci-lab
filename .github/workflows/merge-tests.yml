name: Merge tests

on:
  pull_request:
    branches: [main]
  merge_group:
  issue_comment:
    types: [created]

run-name: "${{ github.event_name == 'issue_comment' && format('Merge tests for PR #{0}', github.event.issue.number) || 'Merge tests' }}"

permissions:
  contents: read

# Each merge group must report its own result to the queue. A cancelled run
# cannot satisfy the required check, so runs are never superseded here.

jobs:
  prepare:
    name: Prepare merge tests
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.comment.body, '!merge-tests') &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      comment-id: ${{ steps.post.outputs.comment-id }}
      pr: ${{ steps.target.outputs.pr }}
      revision: ${{ steps.target.outputs.revision }}
    steps:
      - name: Resolve test revision
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = issue_comment ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
              || { echo "::error::PR number must be a positive integer"; exit 1; }
            revision=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.merge_commit_sha // empty')
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            revision=$EVENT_SHA
          fi

          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::PR does not currently have a test merge commit"; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Compose initial comment
        if: github.event_name == 'issue_comment'
        env:
          MERGE_SHA: ${{ steps.target.outputs.revision }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
        run: |
          {
            echo "## ⏳ Merge tests running…"
            echo
            echo "Running the dummy merge-test suite for PR #$PR_NUMBER at \`${MERGE_SHA:0:7}\`."
            echo
            echo "[Watch progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment-body.md

      - name: Post initial comment
        if: github.event_name == 'issue_comment'
        id: post
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ github.token }}
          issue-number: ${{ steps.target.outputs.pr }}
          body-path: comment-body.md

  merge-tests:
    name: ${{ matrix.name }}
    needs: prepare
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'issue_comment' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Dummy unit tests
            suite: unit
            delay: 10
          - name: Dummy integration tests
            suite: integration
            delay: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', needs.prepare.outputs.pr) || needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Verify test revision
        env:
          TEST_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$TEST_REVISION" ]; then
            echo "::error::PR merge ref changed before the run started; comment !merge-tests again"
            exit 1
          fi

      # Add the matching marker file to a PR to exercise failure reporting.
      - name: Run ${{ matrix.name }}
        env:
          FAIL_MARKER: .github/merge-tests-fail-${{ matrix.suite }}
          WAIT_SECONDS: ${{ matrix.delay }}
        run: |
          echo "Running ${{ matrix.suite }} tests at $(git rev-parse HEAD)"
          sleep "$WAIT_SECONDS"
          if [ -e "$FAIL_MARKER" ]; then
            echo "::error::Intentional failure requested by $FAIL_MARKER"
            exit 1
          fi
          echo "Dummy ${{ matrix.suite }} tests passed"

  merge-tests-result:
    name: Merge tests
    if: >-
      always() &&
      (github.event_name != 'issue_comment' || needs.prepare.result != 'skipped')
    needs: [prepare, merge-tests]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Compose final comment
        if: github.event_name == 'issue_comment' && needs.prepare.result == 'success'
        env:
          MERGE_SHA: ${{ needs.prepare.outputs.revision }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          TEST_RESULT: ${{ needs.merge-tests.result }}
        run: |
          if [ "$TEST_RESULT" = success ]; then
            heading="## ✅ Merge tests passed"
            summary="All dummy test suites passed"
          else
            heading="## ❌ Merge tests failed"
            summary="At least one dummy test suite failed"
          fi
          {
            echo "$heading"
            echo
            echo "$summary for PR #$PR_NUMBER at \`${MERGE_SHA:0:7}\`."
            echo
            echo "[Workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment-body.md

      - name: Update result comment
        if: github.event_name == 'issue_comment' && needs.prepare.result == 'success'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ github.token }}
          issue-number: ${{ needs.prepare.outputs.pr }}
          comment-id: ${{ needs.prepare.outputs.comment-id }}
          edit-mode: replace
          body-path: comment-body.md

      - name: Propagate merge-test failure
        if: >-
          github.event_name != 'pull_request' &&
          (needs.prepare.result != 'success' || needs.merge-tests.result != 'success')
        run: exit 1
