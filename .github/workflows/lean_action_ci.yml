name: Lean Action CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: namespace-profile-argument

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-lake-cache
        if: github.event_name == 'pull_request'
        with:
          marker: ${{ github.event_name }}-lean
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false

  merge-tests:
    name: Merge tests
    runs-on: ubuntu-latest
    steps:
      # The required check must pass before the PR can enter the merge queue;
      # the test suite runs later against the queue's synthetic merge commit.
      - name: Defer tests to merge queue
        run: echo "Merge tests run against the merge group's synthetic commit."
